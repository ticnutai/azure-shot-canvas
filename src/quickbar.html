<!doctype html><html lang="he" dir="rtl" data-view="actions"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>סרגל מהיר</title><link rel="stylesheet" href="quickbar.css"><link rel="stylesheet" href="quickbar-strip.css"><link rel="stylesheet" href="quickbar-office.css"></head><body>
  <button id="edge-handle" aria-label="פתיחת הסרגל המהיר" title="נגיעה פותחת · גרירה מזיזה לכל מקום בקצה המסך"><span></span></button>
  <section id="strip" aria-label="סרגל צילום מהיר">
    <div class="strip-bar">
      <button id="strip-grip" title="גרירה להזזה: לאורך הקצה או לקצה אחר של המסך" aria-label="גרירת הסרגל"><span></span></button>
      <div class="strip-group">
        <button class="strip-big" data-strip-action="region" title="צילום אזור או חלון — המסך קופא ובוחרים עליו"><svg class="strip-icon" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>צילום</span></button>
        <button class="strip-more" data-menu="capture" aria-expanded="false" aria-haspopup="menu" title="עוד אפשרויות צילום">▾</button>
      </div>
      <div class="strip-group">
        <button class="strip-big record" data-strip-action="record" title="התחלת הקלטה"><svg class="strip-icon" viewBox="0 0 24 24"><rect x="3" y="7" width="12" height="10" rx="2"/><path d="M15 11l6-3v8l-6-3z"/></svg><span>הקלטה</span></button>
        <button class="strip-more" data-menu="record" aria-expanded="false" aria-haspopup="menu" title="עוד אפשרויות הקלטה">▾</button>
      </div>
      <div class="strip-tools">
        <button id="strip-history" title="הצילומים האחרונים" aria-label="הצילומים האחרונים"><svg class="tool-icon" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg></button>
        <button id="strip-pin" class="pin-toggle" title="נעיצה — הסרגל נשאר פתוח" aria-pressed="false" aria-label="נעיצה"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M9 3h6l-1 6 3 3v2h-4v7l-1 1-1-1v-7H7v-2l3-3z"/></svg></button>
        <button id="strip-hide" title="הסתרה לקצה המסך" aria-label="הסתרה"><svg class="tool-icon" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </div>
    <div id="strip-menu" role="menu" aria-label="אפשרויות"></div>
  </section>
  <section id="quickbar" aria-label="פעולות מהירות">
    <header><b id="quickbar-title">אורום מהיר</b><span id="recording-state">מוכן</span><button id="show-history" title="הצילומים האחרונים">▤</button><button id="show-actions" title="חזרה לפעולות המהירות">▦</button><button id="pin" class="pin-toggle" title="הצמדה" aria-pressed="false">⌖</button><button id="collapse" title="הסתרה (Esc)">×</button></header>
    <nav id="quickbar-actions">
      <button data-action="screenshot"><i>▣</i><span>צילום מסך</span></button>
      <button data-action="region"><i>▱</i><span>צילום אזור</span></button>
      <button class="record" data-action="record"><i></i><span>התחל הקלטה</span></button>
      <button data-action="pause"><i>Ⅱ</i><span>השהיה</span></button>
      <button data-action="microphone"><i>🎙</i><span>מיקרופון</span></button>
      <button data-action="camera"><i>◉</i><span>מצלמה</span></button>
      <button data-action="openLibrary"><i>▥</i><span>ספרייה</span></button>
      <button data-action="openOutput"><i>⌑</i><span>תיקייה</span></button>
    </nav>
    <section id="capture-card" aria-label="הצילום האחרון">
      <figure id="capture-figure" title="גרירה לתוכנה אחרת · לחיצה כפולה לעריכה">
        <img id="capture-thumb" alt="" draggable="true">
        <figcaption><b id="capture-name"></b><small id="capture-meta"></small></figcaption>
        <span id="capture-badge" hidden></span>
      </figure>
      <div class="capture-actions">
        <button data-capture-action="edit" title="פתיחה בעורך (E / Enter)"><i>✎</i><span>עריכה</span></button>
        <button data-capture-action="copy" title="העתקה ללוח (Ctrl+C)"><i>⧉</i><span>העתקה</span></button>
        <button data-capture-action="pin" title="הצמדה מעל החלונות (P)"><i>⌖</i><span>הצמדה</span></button>
        <button data-capture-action="open-folder" title="הצגה בתיקייה (O)"><i>⌑</i><span>תיקייה</span></button>
        <button data-capture-action="trash" class="danger" title="העברה לסל המיחזור (Delete)"><i>⌫</i><span>מחיקה</span></button>
      </div>
    </section>
    <div id="recent-strip" class="recent-strip" aria-label="צילומים אחרונים"></div>
  </section>
  <section id="history" aria-label="הצילומים האחרונים">
    <header><b>הצילומים האחרונים</b><span id="history-count"></span><button id="history-library" title="פתיחת הספרייה המלאה">▥</button><button id="history-back" title="חזרה">×</button></header>
    <div class="history-filters">
      <input id="history-search" type="search" placeholder="חיפוש לפי שם…" aria-label="חיפוש בצילומים" dir="rtl">
      <div class="history-chips" role="group" aria-label="סוג">
        <button data-kind-filter="all" aria-pressed="true">הכול</button><button data-kind-filter="image" aria-pressed="false">תמונות</button><button data-kind-filter="video" aria-pressed="false">וידאו</button>
      </div>
      <div class="history-chips" role="group" aria-label="זמן">
        <button data-time-filter="all" aria-pressed="true">תמיד</button><button data-time-filter="today" aria-pressed="false">היום</button><button data-time-filter="week" aria-pressed="false">השבוע</button>
      </div>
    </div>
    <div id="history-grid" role="list"></div>
    <div id="history-selection" hidden><span id="history-selected-count"></span><button id="history-select-clear">ביטול בחירה</button><button id="history-trash" class="danger">העברה לסל המיחזור</button></div>
    <p class="history-tip">לחיצה פותחת את הכרטיס · קונטרול+לחיצה בוחרת כמה · לחיצה כפולה לעריכה · גרירה לתוכנה אחרת</p>
  </section>
  <script src="quickbar.js"></script>
</body></html>
